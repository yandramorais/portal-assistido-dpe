spring:
  application:
    name: portal

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:portal}
    username: ${DB_USER:portal}
    password: ${DB_PASSWORD:portal}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      # Coleções LAZY (ex.: checklist de documentos dos cards) carregadas em lote, não uma a uma.
      hibernate.default_batch_fetch_size: 50

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    # Sem context explícito o Liquibase roda TODOS os changesets, inclusive o seed (context:dev).
    # O profile dev sobrescreve com "dev".
    contexts: default

  # Mensagens de validação sempre em pt-BR, independente do Accept-Language.
  web:
    locale: pt_BR
    locale-resolver: fixed

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    # Sem timeout o JavaMail espera para sempre se o SMTP cair, prendendo as threads do @Async
    # e sem nunca gravar a FALHA. Com 5 s o envio falha e fica registrado em notificacao_email.
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

portal:
  jwt:
    # HS256 exige segredo de pelo menos 32 bytes.
    secret: ${JWT_SECRET:dev-secret-troque-em-producao-0123456789abcdef}
    expiracao: 8h
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  mail:
    remetente: ${MAIL_FROM:portal-assistido@dpe.local}

dpe:
  salario-minimo: 1621.00
  limite-salarios: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
