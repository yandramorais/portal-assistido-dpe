spring:
  application:
    name: portal

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:portal}
    username: ${DB_USER:portal}
    password: ${DB_PASSWORD:portal}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_batch_fetch_size: 50

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    contexts: default

  web:
    locale: pt_BR
    locale-resolver: fixed

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

portal:
  jwt:
    secret: ${JWT_SECRET:dev-secret-troque-em-producao-0123456789abcdef}
    expiracao: 8h
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  mail:
    remetente: ${MAIL_FROM:portal-assistido@dpe.local}

dpe:
  salario-minimo: 1621.00
  limite-salarios: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false
  info:
    env:
      enabled: true

info:
  app:
    nome: Portal do Assistido
    descricao: Defensoria Pública do Estado de Goiás

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
    tags-sorter: alpha
    operations-sorter: method
